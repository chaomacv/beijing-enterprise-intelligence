name: Deploy project page
on:
  push:
    branches: [main]
    paths:
      - 'showcase/**'
      - 'scripts/build_showcase_demo.py'
      - 'scripts/test_showcase.cjs'
      - 'scripts/test_gallery.cjs'
      - 'scripts/test_methods.cjs'
      - 'scripts/build_gallery_data.py'
      - 'src/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e .
      - name: Rebuild the synthetic example and check the page
        run: |
          python scripts/build_showcase_demo.py
          node --check showcase/app.js
          node --check showcase/run.js
          node --check showcase/gallery.js
          node --check showcase/methods.js
          node --test scripts/test_showcase.cjs scripts/test_gallery.cjs scripts/test_methods.cjs scripts/test_event_sunburst.cjs scripts/test_enterprise_network.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: showcase
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
