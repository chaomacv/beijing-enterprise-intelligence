name: tests
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: bank-data demo --work-dir /tmp/bank-data-demo
      - run: python scripts/verify_local_model.py --backend rules --work-dir /tmp/bank-rule-regression
      - run: python scripts/build_showcase_demo.py
      - run: node --check showcase/app.js
      - run: node --test scripts/test_showcase.cjs
      - run: python scripts/check_repository.py
