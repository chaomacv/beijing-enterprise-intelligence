[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beijing-enterprise-intelligence"
version = "0.2.0"
description = "Local-model processing of Beijing public-data files into evidenced enterprise events."
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1,<4", "xlrd>=2.0,<3", "defusedxml>=0.7,<1"]

[project.optional-dependencies]
test = ["jsonschema==4.23.0"]
taxonomy = ["duckdb==1.4.5"]
llm = ["transformers>=4.51,<5"]
serve = ["transformers==4.51.3", "accelerate==1.6.0", "lm-format-enforcer==0.11.3", "jsonschema==4.23.0"]

[project.scripts]
bank-data = "bank_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bank_data = ["resources/*.json", "resources/*.md"]
